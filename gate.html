<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gate Load</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #bfe3dd; }
        canvas { display: block; }
        #changeColorBtn {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1;
        }
        #printMeshNamesBtn {
            position: absolute;
            top: 10px;
            left: 150px;
            z-index: 1;
        }
        #popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            z-index: 999;
        }
        #popupOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 998;
        }
        #zoomContainer {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1;
        }
        #zoomInBtn, #zoomOutBtn {
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
        #zoomInBtn:hover, #zoomOutBtn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <button id="changeColorBtn">Mudar Cor</button>
    <button id="printMeshNamesBtn">Imprimir Nomes Meshes</button>
    
    <div id="zoomContainer">
        <button id="zoomInBtn">Zoom +</button>
        <button id="zoomOutBtn">Zoom -</button>
    </div>
    
    <div id="popupOverlay"></div>
    <div id="popup">
        <h2>Mesh 5 Selecionado!</h2>
        <p>Clicaste no mesh 5.</p>
        <button onclick="document.getElementById('popup').style.display='none'; document.getElementById('popupOverlay').style.display='none';">Fechar</button>
    </div>
    
    <!-- Import Map para gerir as dependências da Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // 1. Configuração Básica da Cena
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xbfe3dd);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Controlo de Zoom
        const zoomSpeed = 1;
        const minZoom = 3;
        const maxZoom = 20;

        document.getElementById('zoomInBtn').addEventListener('click', () => {
            camera.position.z = Math.max(minZoom, camera.position.z - zoomSpeed);
        });

        document.getElementById('zoomOutBtn').addEventListener('click', () => {
            camera.position.z = Math.min(maxZoom, camera.position.z + zoomSpeed);
        });

        // 2. Iluminação
        const dirLight = new THREE.DirectionalLight(0xffffff, 3);
        dirLight.position.set(5, 10, 7.5);
        scene.add(dirLight);
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));

        // 3. Variáveis para Animação e Controlo do Rato
        let mixer;
        let gateMesh = null;
        const clock = new THREE.Clock();
        let isDragging = false;
        let previousPointerPosition = { x: 0, y: 0 };
        const rotationSpeed = 0.005;
        
        // Raycasting para detecção de cliques em meshes
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let allMeshes = [];

        const canvas = renderer.domElement;
        canvas.style.touchAction = 'none';
        canvas.addEventListener('pointerdown', (event) => {
            isDragging = true;
            previousPointerPosition.x = event.clientX;
            previousPointerPosition.y = event.clientY;
        });

        const stopDragging = () => {
            isDragging = false;
        };

        canvas.addEventListener('pointerup', stopDragging);
        canvas.addEventListener('pointerleave', stopDragging);
        canvas.addEventListener('pointercancel', stopDragging);

        canvas.addEventListener('pointermove', (event) => {
            if (!isDragging || !gateMesh) return;

            const deltaX = event.clientX - previousPointerPosition.x;
            const deltaY = event.clientY - previousPointerPosition.y;

            gateMesh.rotation.y += deltaX * rotationSpeed;
            gateMesh.rotation.x += deltaY * rotationSpeed;
            gateMesh.rotation.x = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, gateMesh.rotation.x));

            previousPointerPosition.x = event.clientX;
            previousPointerPosition.y = event.clientY;
        });

        // Evento de click para raycasting
        canvas.addEventListener('click', (event) => {
            if (isDragging) return; // Não fazer raycasting enquanto se arrasta
            
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(allMeshes);
            
            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;
                const meshIndex = allMeshes.indexOf(clickedMesh);
                console.log(`Clicaste no mesh ${meshIndex}: ${clickedMesh.name}`);
                
                if (meshIndex === 5) {
                    document.getElementById('popup').style.display = 'block';
                    document.getElementById('popupOverlay').style.display = 'block';
                }
            }
        });

        // 4. Carregar o Modelo Flamingo.glb
        const loader = new GLTFLoader();
        // Nota: Substitui pelo caminho local se tiveres o ficheiro, 
        // ou usa o link direto do repositório da Three.js para testes:
        const url = '/gate_2.glb';

        loader.load(url, (gltf) => {
            gateMesh = gltf.scene;
            
            // Ajustar escala e posição se necessário
            gateMesh.scale.set(0.05, 0.05, 0.05);
            gateMesh.position.y = 2;
            
            scene.add(gateMesh);

            // Recolher todos os meshes para raycasting
            allMeshes = [];
            gateMesh.traverse((child) => {
                if (child.isMesh) {
                    allMeshes.push(child);
                }
            });

            // Configurar a animação
            if (gltf.animations && gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(gateMesh);
                mixer.clipAction(gltf.animations[0]).play();
            }

            // Botão para mudar cor
            document.getElementById('changeColorBtn').addEventListener('click', () => {
                const meshes = [];
                gateMesh.traverse((child) => {
                    if (child.isMesh) {
                        meshes.push(child);
                    }
                });
                console.log('Meshes encontrados:', meshes.length);
                if (meshes.length >= 2) {
                    const mat0 = meshes[5].material;
                    const mat1 = meshes[1].material;
                    if (Array.isArray(mat0)) {
                        mat0.forEach(m => m.color.set(0xff0000));
                    } else if (mat0) {
                        mat0.color.set(0xff0000);
                    }
                    if (Array.isArray(mat1)) {
                        //mat1.forEach(m => m.color.set(0xff0000));
                    } else if (mat1) {
                        //mat1.color.set(0xff0000);
                    }
                    console.log('Cor mudada para vermelho ');
                } else {
                    console.log('Menos de 2 meshes encontrados');
                }
            });

            // Botão para imprimir nomes dos meshes
            document.getElementById('printMeshNamesBtn').addEventListener('click', () => {
                const meshes = [];
                gateMesh.traverse((child) => {
                    if (child.isMesh) {
                        meshes.push(child);
                    }
                });
                console.log('=== NOMES DOS MESHES ===');
                meshes.forEach((mesh, index) => {
                    console.log(`[${index}] ${mesh.name}`);
                });
                console.log(`Total: ${meshes.length} meshes`);
            });

        }, undefined, (error) => {
            console.error('Erro ao carregar o modelo:', error);
        });

        // 5. Ciclo de Renderização (Loop)
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            if (mixer) mixer.update(delta); // Atualiza a animação do pássaro

            renderer.render(scene, camera);
        }

        // Ajustar redimensionamento da janela
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
